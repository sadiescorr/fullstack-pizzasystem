{% extends "base.html" %}

{% block content %}

<div class="container text-center d-flex justify-content-center align-items-center min-vh-100">
    <div class="bg-white shadow-lg rounded p-5 text-center" style="max-width: 800px;">

        <h2>Order History for {{ user.email }}</h2>

        {% if orders %}
            <table border="1">
            <tr>
                <th>ADDRESS</th>
                <th>PIZZA</th>
                <th>ORDER TIME</th>
            </tr>
            {% for order in orders %}
            <tr>
                <td>{{ order.address }}</td>
                <td> {{ order.pizza }}</td>
                <td>{{ order.order_time }}</td>
            </tr>
        {% endfor %}
            </table>
        {% else %}
            <p>No past orders found.</p>
        {% endif %}

        <button class="btn btn-dark w-100 mt-3" href="/account" role="button">Order More?</a>
{% endblock %}
