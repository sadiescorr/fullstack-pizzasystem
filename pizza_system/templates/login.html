{% extends "base.html" %}

{% block content %}

<div class="container text-center d-flex justify-content-center align-items-center min-vh-100">
    <div class="card p-5 shadow-lg">
        <h2>Log In!</h2>
        <br>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                {{ form.as_p }}
            </div>
            <button type="submit" class="btn btn-dark w-100 mt-3">Log In</button>
        </form>
    </div>
</div>

{% endblock %}
